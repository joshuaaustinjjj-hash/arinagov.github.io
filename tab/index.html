<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Sandbox Bank</title>
    <style>
        body { font-family: 'Roboto', system-ui, sans-serif; background: #f0f2f5; text-align: center; padding: 40px; }
        .card { background: white; max-width: 400px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        
        /* OFFICIAL GOOGLE ID BUTTON STYLING */
        .google-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            color: #1f1f1f;
            border: 1px solid #747775;
            padding: 0 16px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'Roboto', sans-serif;
            border-radius: 20px;
            cursor: pointer;
            height: 40px;
            width: 85%;
            transition: background-color 0.2s, box-shadow 0.2s;
            margin: 10px 0 20px 0;
            box-sizing: border-box;
        }
        .google-btn:hover {
            background-color: #f8fafc;
            box-shadow: 0 1px 3px 0 rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
            border-color: #747775;
        }
        .google-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            opacity: 0.6;
        }
        .google-icon {
            width: 18px;
            height: 18px;
            margin-right: 12px;
        }

        /* DIVIDER STYLING */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #70757a;
            font-size: 12px;
            margin: 15px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #dadce0;
        }
        .divider:not(:empty)::before { margin-right: .25em; }
        .divider:not(:empty)::after { margin-left: .25em; }

        /* STANDARD FORM & BUTTONS */
        button.action-btn { background: #1a73e8; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; margin: 10px 5px; width: 85%; box-sizing: border-box; font-weight: bold;}
        button.logout { background: #6c757d; border: none; padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; margin: 10px; color: white; width: auto;}
        button.dashboard-action { background: #1a73e8; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; margin: 10px 5px; width: auto;}
        input { padding: 12px; font-size: 16px; width: 85%; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        h2 { color: #2c3e50; margin-top: 0; }
        .balance { font-size: 32px; font-weight: bold; color: #27ae60; margin: 20px 0; }
        .toggle-text { color: #1a73e8; font-size: 14px; margin-top: 15px; cursor: pointer; text-decoration: none; font-weight: 500;}
        .toggle-text:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <!-- AUTHENTICATION GATEWAY PANEL -->
    <div id="auth-screen" class="card">
        <h2 id="auth-title">🔒 Sandbox Mobile Bank</h2>
        <p id="auth-desc">Log in or create a profile to test multi-stage balances.</p>

                <path fill="#4285F4" d="M46.5 24c0-1.55-.15-3.24-.47-4.77H24v9.03h12.75c-.55 2.97-2.22 5.49-4.75 7.19l7.39 5.73C43.71 37.14 46.5 31.23 46.5 24z"/>
                <path fill="#FBBC05" d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.98-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.39-5.73c-2.11 1.4-4.81 2.32-8.5 2.32-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span id="google-btn-text">Initializing Secure Engine...</span>
        </button>

        <div class="divider">or use security password</div>

        <!-- IDENTITY FORM METHODS: EMAIL/PASSWORD -->
        <input type="email" id="email-input" placeholder="Email Address">
        <input type="password" id="password-input" placeholder="Password">
        <br>
        <button id="submit-auth-btn" class="action-btn">Log In</button>
        <div id="toggle-auth-view" class="toggle-text">Need a new profile? Create account here</div>
    </div>

    <!-- BANKING DASHBOARD -->
    <div id="dashboard-screen" class="card hidden">
        <h2 id="welcome-msg">Welcome Back!</h2>
        <p>Your Current Balance:</p>
        <div class="balance">\$<span id="balance-val">0.00</span></div>
        
        <input type="number" id="amount-input" placeholder="Enter amount (\$)">
        <br>
        <button id="deposit-btn" class="dashboard-action">Deposit Money</button>
        <button id="withdraw-btn" class="dashboard-action">Withdraw Money</button>
        <br>
        <button id="logout-btn" class="logout">Log Out</button>
    </div>
