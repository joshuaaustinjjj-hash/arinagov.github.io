        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(88, 24, 124, 0.45);
            z-index: 0;
        }
        .content-wrap {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .card { background: white; max-width: 400px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        .google-btn { display: inline-flex; align-items: center; justify-content: center; background: white; color: #1f1f1f; border: 1px solid #747775; padding: 12px; border-radius: 20px; cursor: pointer; width: 85%; box-sizing: border-box; margin: 10px 0; font-weight: 500; }
        .google-btn:hover { background-color: #f8fafc; }
        .google-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .google-icon { width: 18px; height: 18px; margin-right: 12px; flex-shrink: 0; }
        .divider { display: flex; align-items: center; text-align: center; color: #70757a; font-size: 12px; margin: 15px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #dadce0; }
        .divider:not(:empty)::before { margin-right: .25em; }
        .divider:not(:empty)::after { margin-left: .25em; }
        button.action-btn { background: #1a73e8; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 85%; font-weight: bold; box-sizing: border-box; }
        button.logout { background: #6c757d; border: none; padding: 10px; border-radius: 6px; cursor: pointer; color: white; }
        input { padding: 12px; width: 85%; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .toggle-text { color: #1a73e8; font-size: 14px; margin-top: 15px; cursor: pointer; display: inline-block; }
        .forgot-text { color: #5f6368; font-size: 13px; margin-top: 8px; cursor: pointer; display: inline-block; text-decoration: underline; }
        .error-msg { color: #d93025; font-size: 13px; margin-top: 8px; min-height: 16px; }
        .info-msg { color: #188038; font-size: 13px; margin-top: 8px; min-height: 16px; }

        .id-label { color: #70757a; font-size: 14px; margin-top: 10px; }

<body>
    <div class="content-wrap">
    <div id="auth-screen" class="card">
        <div class="id-banner"></div>
        <h2 id="auth-title">Arina Goverment Portal</h2>
        <p id="auth-desc">Sign or Register to obtain your UEA ID..</p>
        <button id="google-login-btn" class="google-btn" disabled>
            <svg class="google-icon" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24c0-1.55-.15-3.24-.47-4.77H24v9.03h12.75c-.55 2.97-2.22 5.49-4.75 7.19l7.39 5.73C43.71 37.14 46.5 31.23 46.5 24z"/><path fill="#FBBC05" d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.98-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.39-5.73c-2.11 1.4-4.81 2.32-8.5 2.32-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            <span id="google-btn-text">Initializing Engine...</span>
        </button>
        <div class="divider">or use standard credentials</div>
        <input type="email" id="email-input" placeholder="Email Address">
        <input type="password" id="password-input" placeholder="Password"><br>
        <button id="submit-auth-btn" class="action-btn">Log In</button>
        <br>
        <div id="toggle-auth-view" class="toggle-text">Create account here</div>
        <br>
        <div id="forgot-password-link" class="forgot-text">Forgot password?</div>
        <div id="error-msg" class="error-msg"></div>
        <div id="info-msg" class="info-msg"></div>
    </div>
    <div id="dashboard-screen" class="card hidden">
        <div class="id-banner"></div>
        <h2 id="welcome-msg">Welcome!</h2>
        <p class="id-label">Your unique ID:</p>
        <div class="id-value" id="uea-id-val">UEA----</div>
        <button id="logout-btn" class="logout">Log Out</button>
    </div>
    </div>

    <!-- Firebase compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBNhT4zf-o9thQtch5b0g4FIlpBLeDS0YU",
            authDomain: "website-2eba3.firebaseapp.com",
            projectId: "website-2eba3",
            storageBucket: "website-2eba3.firebasestorage.app",
            messagingSenderId: "376796164206",
            appId: "1:376796164206:web:685b55a5e42217dae7367f",
            measurementId: "G-4KQ3NEX5DL"
        };

        const authScreen = document.getElementById('auth-screen');
        const authTitle = document.getElementById('auth-title');
        const googleLoginBtn = document.getElementById('google-login-btn');
        const googleBtnText = document.getElementById('google-btn-text');
        const emailInput = document.getElementById('email-input');
        const passwordInput = document.getElementById('password-input');
        const submitAuthBtn = document.getElementById('submit-auth-btn');
        const toggleAuthView = document.getElementById('toggle-auth-view');
        const forgotPasswordLink = document.getElementById('forgot-password-link');
        const dashboardScreen = document.getElementById('dashboard-screen');
        const logoutBtn = document.getElementById('logout-btn');
        const welcomeMsg = document.getElementById('welcome-msg');
        const ueaIdVal = document.getElementById('uea-id-val');
        const errorMsg = document.getElementById('error-msg');
        const infoMsg = document.getElementById('info-msg');

        let isLoginMode = true;

        function showError(message) {
            infoMsg.innerText = '';
            errorMsg.innerText = message || '';
        }

        function showInfo(message) {
            errorMsg.innerText = '';
            infoMsg.innerText = message || '';
        }

        // Assigns a sequential UEA#### id to a user on their first-ever login,
        // or returns their existing one on every later login. Uses a Firestore
        // transaction on a shared counter doc so concurrent registrations
        // never get the same number.
        async function getOrAssignUeaId(db, user) {
            const userRef = db.collection('users').doc(user.uid);
            const counterRef = db.collection('counters').doc('registrations');

            return db.runTransaction(async (t) => {
                const userSnap = await t.get(userRef);
                if (userSnap.exists && userSnap.data().ueaId) {
                    return userSnap.data().ueaId;
                }

                const counterSnap = await t.get(counterRef);
                const lastId = counterSnap.exists ? (counterSnap.data().lastId || 0) : 0;
                const nextId = lastId + 1;
                const ueaId = 'UEA' + String(nextId).padStart(4, '0');

                t.set(counterRef, { lastId: nextId }, { merge: true });
                t.set(userRef, {
                    ueaId: ueaId,
                    email: user.email || null,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                return ueaId;
            });
        }

        if (typeof firebase === 'undefined') {
            googleBtnText.innerText = "Sign-in unavailable";
            showError("Firebase failed to load. Check your network connection or script URLs.");
        } else {
            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            const db = firebase.firestore();
            const provider = new firebase.auth.GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });

            googleLoginBtn.removeAttribute('disabled');
            googleBtnText.innerText = "Continue with Google";

            googleLoginBtn.addEventListener('click', () => {
                showError('');
                googleLoginBtn.setAttribute('disabled', 'true');
                googleBtnText.innerText = "Launching Google...";
                auth.signInWithPopup(provider).then(() => {
                    googleBtnText.innerText = "Continue with Google";
                }).catch(err => {
                    googleBtnText.innerText = "Continue with Google";
                    showError(err.message);
                }).finally(() => {
                    googleLoginBtn.removeAttribute('disabled');
                });
            });

            toggleAuthView.addEventListener('click', () => {
                showError('');
                isLoginMode = !isLoginMode;
                authTitle.innerText = isLoginMode ? "Arina Goverment Login Portal" : "🛠️ Create Account";
                submitAuthBtn.innerText = isLoginMode ? "Log In" : "Register";
                toggleAuthView.innerText = isLoginMode ? "Create account here" : "Sign in here";
            });

            submitAuthBtn.addEventListener('click', () => {
                showError('');
                const em = emailInput.value.trim();
                const pw = passwordInput.value;
                if (!em || !pw) return showError("Fill in entries.");
                if (isLoginMode) {
                    auth.signInWithEmailAndPassword(em, pw).catch(err => showError(err.message));
                } else {
                    auth.createUserWithEmailAndPassword(em, pw).catch(err => showError(err.message));
                }
            });

            forgotPasswordLink.addEventListener('click', () => {
                showError('');
                const em = emailInput.value.trim();
                if (!em) return showError("Enter your email above first, then tap 'Forgot password?'.");
                auth.sendPasswordResetEmail(em).then(() => {
                    showInfo("Password reset email sent to " + em + ". Check your inbox (and spam folder).");
                }).catch(err => showError(err.message));
            });

            logoutBtn.addEventListener('click', () => {
                auth.signOut();
            });

            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    authScreen.classList.add('hidden');
                    dashboardScreen.classList.remove('hidden');
                    welcomeMsg.innerText = `Welcome, ${user.displayName || user.email}!`;
                    ueaIdVal.innerText = "Loading...";
                    try {
                        const ueaId = await getOrAssignUeaId(db, user);
                        ueaIdVal.innerText = ueaId;
                    } catch (err) {
                        ueaIdVal.innerText = "Error";
                        showError("Could not assign/retrieve ID: " + err.message);
                    }
                } else {
                    authScreen.classList.remove('hidden');
                    dashboardScreen.classList.add('hidden');
                    ueaIdVal.innerText = "UEA----";
                }
            });
        }
    </script>
</body>
</html>
